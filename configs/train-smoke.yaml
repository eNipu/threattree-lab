model: Qwen/Qwen3-4B-MLX-4bit
train: true
fine_tune_type: lora
data: data/splits
seed: 42
num_layers: 8
batch_size: 1
grad_accumulation_steps: 1
iters: 20
learning_rate: 1.0e-5
max_seq_length: 2048
grad_checkpoint: true
mask_prompt: true
val_batches: -1
steps_per_report: 5
steps_per_eval: 10
save_every: 10
adapter_path: artifacts/adapters/smoke
lora_parameters:
  keys: [self_attn.q_proj, self_attn.v_proj]
  rank: 8
  scale: 20.0
  dropout: 0.0
